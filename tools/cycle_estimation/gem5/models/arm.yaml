name: arm
description: Out-of-order ARM (aarch64) core (gem5 ArmO3CPU) with private L1 caches.

config: se_model.py
cpu_type: ArmO3CPU
mem_mode: timing
m5op_abi: arm64
compiler: aarch64-none-linux-gnu-g++
compiler_flags: ["-O2", "-static"]

params:
  l1i-size: 32kB
  l1d-size: 32kB
  l1i-assoc: 2
  l1d-assoc: 2
  cacheline: 64
