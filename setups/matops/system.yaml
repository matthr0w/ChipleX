chiplets:
  - name: fpga
    type: single-core

  - name: chiplet0
    type: single-core

  - name: chiplet1
    type: single-core

  - name: chiplet2
    type: single-core

  - name: chiplet3
    type: single-core

interconnect:
  type: ucie
  connections:
    - endpoints: [fpga, chiplet0]
    - endpoints: [chiplet0, chiplet1]
    - endpoints: [chiplet1, chiplet2]
    - endpoints: [chiplet2, chiplet3]
    - endpoints: [chiplet3, fpga]