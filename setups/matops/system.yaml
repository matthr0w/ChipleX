chiplets:
  - name: fpga
    type: single-core
    interconnects:
      - name: interconnect
        type: pcie

  - name: chiplet0
    type: single-core
    interconnects:
      - name: interconnect
        type: pcie

  - name: chiplet1
    type: single-core
    interconnects:
      - name: interconnect
        type: pcie
  
  - name: chiplet2
    type: single-core
    interconnects:
      - name: interconnect
        type: pcie

  - name: chiplet3
    type: single-core
    interconnects:
      - name: interconnect
        type: pcie

connections:
  - endpoints: [fpga.interconnect, chiplet0.interconnect]
  - endpoints: [chiplet0.interconnect, chiplet1.interconnect]
  - endpoints: [chiplet1.interconnect, chiplet2.interconnect]
  - endpoints: [chiplet2.interconnect, chiplet3.interconnect]
  - endpoints: [chiplet3.interconnect, fpga.interconnect]