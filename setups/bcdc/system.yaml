chiplets:
  - name: fpga
    type: single-core
    interconnects:
      - name: pulp
        type: serial-link

  - name: chiplet1
    type: single-core-hw
    interconnects:
      - name: pulp
        type: serial-link
      - name: spi
        type: spi

  - name: mem_chiplet1
    type: memory
    interconnects:
      - name: spi
        type: spi

  - name: chiplet2
    type: single-core-hw
    interconnects:
      - name: pulp
        type: serial-link
      - name: spi
        type: spi

  - name: mem_chiplet2
    type: memory
    interconnects:
      - name: spi
        type: spi

connections:
  - endpoints: [fpga.pulp, chiplet1.pulp]
  - endpoints: [fpga.pulp, chiplet2.pulp]
  - endpoints: [chiplet1.spi, mem_chiplet1.spi]
  - endpoints: [chiplet2.spi, mem_chiplet2.spi]
  - endpoints: [chiplet1.pulp, chiplet2.pulp]