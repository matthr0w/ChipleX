chiplets:
  - name: fpga
    type: compute
    interconnects:
      - name: interconnect
        type: serial-link

  - name: chiplet0
    type: compute
    interconnects:
      - name: interconnect
        type: serial-link

  - name: chiplet1
    type: compute
    interconnects:
      - name: interconnect
        type: serial-link

connections:
