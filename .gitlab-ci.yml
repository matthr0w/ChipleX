stages:
  - release

variables:
  SYSTEMC_VERSION: "3.0.1"
  RELEASE_IMAGE: "ubuntu:22.04"

release:linux-x86_64:
  stage: release
  image: $RELEASE_IMAGE
  tags:
    - stuws01
  cache:
    key: "systemc-$SYSTEMC_VERSION-$RELEASE_IMAGE"
    paths:
      - .systemc-install/
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update
    - apt-get install -y --no-install-recommends
        build-essential cmake git ca-certificates
        python3 python3-venv python3-pip python3-dev libpython3.10
        libgl1 libegl1 libglib2.0-0 libdbus-1-3
        libxkbcommon0 libxkbcommon-x11-0
        libx11-6 libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0
        libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-render0
        libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0
        libxcb-xinerama0 libxcb-xkb1
        libfontconfig1 libfreetype6 libxrender1 libxi6
  script:
    - make bundle
  artifacts:
    name: "chiplex-$CI_COMMIT_REF_SLUG"
    paths:
      - dist/chiplex
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: manual
      allow_failure: true
